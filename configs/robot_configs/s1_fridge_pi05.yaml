# Native 34D Cartesian data, using the pi0.5 state/action representation.
# Each pose uses xyz + the first two ROWS of the rotation matrix (6D).
# Select 32 dimensions: torso, arms, grippers and chassis; leave head unchanged
# when reconstructing the native 34D command at deployment.
# Normalize the packed 32D vector before scattering it into Lingbot's 55D input.
# Arm XYZ, grippers and chassis keep the original channel locations. SO(3)
# rotation values replace quaternion/Euler channels and occupy extra channels;
# those channels require finetuning despite retaining the pretrained weights.
pi05_io:
  action_valid_dim:
    torso: [0, 9]
    left_arm: [9, 18]
    left_gripper: [18, 19]
    right_arm: [19, 28]
    right_gripper: [28, 29]
    chassis: [31, 34]
  action_max_dim: 32
  action_mode: delta_so3
  action_delta_mask: [9, 9, -1, 9, -1, 3]
  state_axis: base
  action_axis: self
  # One model index for each packed dimension, in action_valid_dim order:
  # torso xyz: [30,39,31]; torso rot6D: [32,33,40,41,42,43]
  # left xyz: [14,15,16]; left rot6D: [17,18,19,20,51,52]; grip: [28]
  # right xyz: [21,22,23]; right rot6D: [24,25,26,27,53,54]; grip: [29]
  # chassis: [36,37,38]
  # [39:44] repurposes part of the pretrained hand channels; [51:55] was
  # reserved. Arm [0:14], head [34:36] and remaining hand [44:51] are masked.
  model_indices: [30,39,31,32,33,40,41,42,43,14,15,16,17,18,19,20,51,52,28,21,22,23,24,25,26,27,53,54,29,36,37,38]

states:
  - observation.state.robot.position:
      origin_keys: cartesian_so3_dict.cartesian_pose_state

actions:
  - action.robot.position:
      origin_keys: cartesian_so3_dict.cartesian_pose_command
      # Pi05IO performs the SO(3) pose delta before normalization.
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: images_dict.head.rgb
  - observation.images.camera_wrist_left:
      origin_keys: images_dict.left.rgb
  - observation.images.camera_wrist_right:
      origin_keys: images_dict.right.rgb

norm_stats: assets/norm_stats/s1_fridge_pi05.json
